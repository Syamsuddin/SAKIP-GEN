# Reverse proxy SAKIP-Gen pada subdomain terpisah (mis. ai.contoh.id).
# TLS dikelola certbot (akan menambah blok 443 + sertifikat otomatis bila dijalankan
# dengan `certbot --nginx`). Sesuaikan server_name.

server {
    listen 80;
    listen [::]:80;
    server_name ai.contoh.id;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.contoh.id;

    # ssl_certificate     /etc/letsencrypt/live/ai.contoh.id/fullchain.pem;   # certbot
    # ssl_certificate_key /etc/letsencrypt/live/ai.contoh.id/privkey.pem;     # certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf;                        # certbot

    client_max_body_size 256k;   # >= MAX_BODY_BYTES app (default 64k)

    # Header proxy: WAJIB agar rate-limit per-klien & deteksi skema benar.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Mini App (form usulan) + API simpan
    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    # Webhook Telegram (POST saja; path memuat secret)
    location ~ ^/webhook/ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }

    # Healthcheck internal
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}
